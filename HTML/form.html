<!DOCTYPE html> 
<!-- bhartah -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<center>
        <h1>Registration</h1>
        <label for="">Name</label>
        <input type="text" name="" id="" minlength="20" role="checkbox9"> <br> <br>

        <label for="">Email</label>
        <input type="email" name="" id="" required> <br> <br>

        <label for="">Password</label>
        <input type="password" name="" id="" minlength="8" maxlength="15"
        pattern="[0-9][a-z][A-Z][!@#$%^&*]"
        > <br> <br> 

        <label for="">Mobile</label>
        <input type="number" name="" id=""  pattern="[0-9],{10}"> <br> <br>

        <label for="">Address</label>
        <input type="text" name="" id="" readonly>

        <label for="">Age</label>
        <input type="number" name="" id="" min="18"> <br><br>    

        <label for="">Aadhar</label>
        <input type="file" name="" id=""> <br> <br>

        <button type="submit">Submit</button>

</center>
</body>
</html>
